<!DOCTYPE html>
<html lang="es" data-estado="cargando">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Programa de fiestas</title>

    <!-- El estado inicial se define aquí para evitar destellos antes del CSS. -->
    <style>
        [data-estado="cargando"] #aplicacion { visibility:hidden; }
        [data-estado="cargando"] body { overflow:hidden; }
        #estadoCarga { position:fixed; inset:0; z-index:1000; display:grid; place-items:center; background:#f7f7f8; color:#454952; font:500 16px/1.5 system-ui,sans-serif; text-align:center; padding:24px; }
        #estadoCarga[hidden] { display:none; }
        .estado-carga-indicador { display:block; width:32px; height:32px; margin:0 auto 18px; border:3px solid #dedfe3; border-top-color:#757b85; border-radius:50%; animation:girarCarga .8s linear infinite; }
        #textoCarga { margin:0; }
        @keyframes girarCarga { to { transform:rotate(360deg); } }
        @media (prefers-reduced-motion:reduce) { .estado-carga-indicador { animation:none; } }
    </style>

    <meta name="description"
        content="Programa Oficial de las Fiestas Patronales">

    <meta name="theme-color"
        content="#8B0000">

    <link
		id="favicon"
		rel="icon"
		href="img/icon_festes.png">

    <!-- Google Fonts -->

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet"
        href="css/variables.css?v=20261127">

    <link rel="stylesheet"
        href="css/estilos.css?v=20261127">

    <link rel="stylesheet"
        href="css/responsive.css?v=20261127">

    <link rel="stylesheet"
        href="css/selector-programas.css?v=20261127">



</head>

<body>

    <div id="estadoCarga" role="status" aria-live="polite">
        <div>
            <span class="estado-carga-indicador" aria-hidden="true"></span>
            <p id="textoCarga">Cargando programa…</p>
        </div>
    </div>

    <noscript><style>#estadoCarga { display:none; }</style>Activa JavaScript en tu navegador para consultar el programa de fiestas.</noscript>

    <div id="aplicacion" aria-busy="true" inert>

    <!-- BARRA GLOBAL DE LA APLICACION -->

    <section class="barraAplicacion" aria-label="Seleccionar programa de fiestas">

        <div class="barraAplicacion-contenido">

            <span class="barraAplicacion-etiqueta">
                Seleccionar programa
            </span>

            <div id="selectorProgramas" class="selector-programas"></div>

        </div>

    </section>

    <!-- CABECERA -->

    <header id="hero">

        <div class="hero-overlay">

            <img id="logo"
                class="logo"
                alt=""
                hidden>

            <div class="titulos">

                <h1 id="tituloWeb">
                </h1>

                <h2 id="subtituloWeb">
                </h2>

            </div>

        </div>

    </header>

    <!-- BARRA SUPERIOR -->

    <section class="barraSuperior">

    <div id="anioFiestas"></div>

		<input
			type="search"
			id="buscador" aria-label="Buscar actos en los días publicados" disabled
			placeholder="Buscar actos...">

		<button
			id="botonFavoritos" type="button" disabled
			class="boton">
			❤️ Mis favoritos
		</button>

    <div id="contadorActo">
        Cargando programa...
    </div>

	</section>

    <p id="avisoFavoritos" role="status" hidden></p>

    <!-- CONTENIDO -->

    <div class="contenedor">

        <!-- MENÚ -->

        <aside id="menu" aria-label="Días del programa">

        </aside>

        <!-- CONTENIDO -->

        <main id="contenido">

            <div class="loader">

                Cargando programa...

            </div>

        </main>

    </div>

    <!-- PIE -->

    <footer>

        <p id="copyright"></p>

    </footer>

    </div>

    <!-- JAVASCRIPT -->

    <script src="js/helpers.js?v=20261127-3"></script>

    <script src="js/selector-programas.js?v=20261127-3"></script>
	
	<script src="js/favoritos.js?v=20261127"></script>

    <script src="js/programa.js?v=20261127-2"></script>

    <script src="js/menu.js?v=20261127"></script>

    <script src="js/tarjetas.js?v=20261127"></script>

    <script src="js/app.js?v=20261127-3"></script>




</body>

</html>
